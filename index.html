<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>선거 집계 대시보드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f6fa;--surface:#ffffff;--surface2:#f0f3f8;
  --border:#dde2ec;--text:#1a2035;--text2:#5a6480;--text3:#8a92a6;
  --blue:#3b7dd8;--blue-l:#e8f0fb;
  --teal:#1d9e75;--teal-l:#e1f5ee;
  --amber:#ba7517;--amber-l:#faeeda;
  --coral:#d85a30;--coral-l:#faece7;
  --purple:#534ab7;--purple-l:#eeedfe;
  --r:10px;--rs:6px;
}
body{background:var(--bg);color:var(--text);font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;font-size:14px;min-height:100vh}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:13px 26px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.hicon{width:34px;height:34px;background:var(--blue);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px}
.header h1{font-size:16px;font-weight:700}
.hsub{font-size:12px;color:var(--text3);margin-left:auto}
.upload-zone{margin:24px 26px;border:2px dashed var(--border);border-radius:var(--r);padding:44px;text-align:center;background:var(--surface);cursor:pointer;transition:.2s}
.upload-zone:hover,.upload-zone.drag{border-color:var(--blue);background:var(--blue-l)}
.upload-zone input{display:none}
.uicon{font-size:42px;margin-bottom:12px}
.upload-zone p{color:var(--text2);font-size:14px}
.upload-zone strong{color:var(--blue)}
.ubtn{margin-top:16px;display:inline-block;background:var(--blue);color:#fff;padding:9px 24px;border-radius:var(--rs);font-size:13px;font-weight:600;cursor:pointer;border:none}
#dash{display:none;padding:18px 26px 48px}
.sec{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px 17px;margin-bottom:14px}
.sec-title{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.05em;text-transform:uppercase;margin-bottom:11px}
.frow{display:flex;flex-wrap:wrap;gap:11px;align-items:flex-end}
.fgrp{display:flex;flex-direction:column;gap:4px}
.fgrp label{font-size:11px;color:var(--text2);font-weight:600}
.fgrp select{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:6px 10px;font-size:13px;color:var(--text);outline:none;min-width:130px;cursor:pointer}
.fgrp select:focus{border-color:var(--blue)}
.rbtn{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:7px 13px;font-size:12px;color:var(--text2);cursor:pointer;font-weight:600}
.rbtn:hover{background:var(--border)}
.dtitle{font-size:11px;font-weight:700;color:var(--text3);letter-spacing:.05em;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:9px}
.dcnt{background:var(--blue-l);color:var(--blue);font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px}
.dall{padding:5px 11px;border:1px solid var(--blue);border-radius:20px;background:transparent;color:var(--blue);font-size:12px;font-weight:700;cursor:pointer}
.dall:hover{background:var(--blue);color:#fff}
.dcards{display:flex;flex-wrap:wrap;gap:6px}
.dcard{padding:5px 11px;border:1px solid var(--border);border-radius:20px;background:var(--surface2);color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;user-select:none;transition:.15s;white-space:nowrap}
.dcard:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-l)}
.dcard.sel{background:var(--blue);color:#fff;border-color:var(--blue)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:14px}
.ccrd{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:17px}
.ccrd.full{grid-column:1/-1}
.ctitle{font-size:13px;font-weight:700;margin-bottom:13px;display:flex;align-items:center;gap:7px}
.cdot{width:8px;height:8px;border-radius:50%}
.cwrap{position:relative;height:220px}
.tsec{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:17px}
.thead2{display:flex;align-items:center;gap:11px;margin-bottom:13px;flex-wrap:wrap}
.thead2 h3{font-size:13px;font-weight:700;flex:1}
.sbox{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:7px 12px;font-size:13px;color:var(--text);outline:none;width:210px}
.sbox:focus{border-color:var(--blue)}
.twrap{overflow-x:auto;max-height:400px;overflow-y:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{position:sticky;top:0;z-index:10}
thead th{background:var(--surface2);color:var(--text2);font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:9px 11px;border-bottom:2px solid var(--border);text-align:left;cursor:pointer;white-space:nowrap;user-select:none}
thead th:hover{color:var(--blue)}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
tbody tr:hover{background:var(--surface2)}
tbody td{padding:8px 11px;white-space:nowrap}
.pflag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:700}
.tfoot2{margin-top:9px;font-size:12px;color:var(--text3)}
.nodata{text-align:center;padding:36px;color:var(--text3)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--surface2)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
</style>
</head>
<body>

<div class="header">
  <div class="hicon">🗳</div>
  <h1>선거 집계 대시보드</h1>
  <span class="hsub" id="hsub">선거집계1.csv 자동 로드</span>
</div>

<div class="upload-zone" id="upzone" style="display:none" onclick="document.getElementById('fi').click()">
  <div class="uicon">📂</div>
  <p><strong>선거집계1.csv</strong> 파일을 여기에 끌어다 놓거나</p>
  <p style="margin-top:6px;font-size:13px;color:var(--text3)">클릭하여 파일을 선택하세요 (.csv)</p>
  <button class="ubtn" onclick="event.stopPropagation();document.getElementById('fi').click()">📁 파일 선택</button>
  <input type="file" id="fi" accept=".csv">
</div>

<div id="dash">

  <!-- 슬라이서 -->
  <div class="sec">
    <div class="sec-title">🔍 슬라이서</div>
    <div class="frow">
      <div class="fgrp"><label>선거년도</label><select id="fy"><option value="">전체</option></select></div>
      <div class="fgrp"><label>선거명</label><select id="fn"><option value="">전체</option></select></div>
      <div class="fgrp"><label>정당</label><select id="fp"><option value="">전체</option></select></div>
      <div class="fgrp"><label>기호</label><select id="fk"><option value="">전체</option></select></div>
      <button class="rbtn" onclick="resetFilters()">↺ 초기화</button>
    </div>
  </div>

  <!-- 면동 카드 -->
  <div class="sec">
    <div class="dtitle">
      📍 면동 선택 <span style="font-weight:400;color:var(--text3);font-size:10px">(다중 선택)</span>
      <span class="dcnt" id="dcnt">전체</span>
      <button class="dall" onclick="selAllDong()">전체 선택/해제</button>
    </div>
    <div class="dcards" id="dcards"></div>
  </div>

  <!-- 차트 -->
  <div class="cgrid">
    <div class="ccrd">
      <div class="ctitle"><span class="cdot" style="background:var(--blue)"></span>정당별 득표수</div>
      <div class="cwrap"><canvas id="ch1"></canvas></div>
    </div>
    <div class="ccrd">
      <div class="ctitle"><span class="cdot" style="background:var(--teal)"></span>정당별 득표율</div>
      <div class="cwrap"><canvas id="ch2"></canvas></div>
    </div>
    <div class="ccrd full">
      <div class="ctitle"><span class="cdot" style="background:var(--purple)"></span>면동별 정당별 득표수</div>
      <div class="cwrap" style="height:280px"><canvas id="ch3"></canvas></div>
    </div>
  </div>

  <!-- 테이블 -->
  <div class="tsec">
    <div class="thead2">
      <h3>📋 상세 데이터</h3>
      <input class="sbox" id="sb" placeholder="🔍 검색..." oninput="renderTable()">
    </div>
    <div class="twrap"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
    <div class="tfoot2" id="tf"></div>
  </div>
</div>

`;
let raw=[],hdrs=[],selDongs=new Set(),allDongs=[],sortC=-1,sortD=1;
let c1,c2,c3;
let C={};

const PARTY_FIXED={
  '국민의힘':'#E61E2B','국민의 힘':'#E61E2B',
  '새누리당':'#C9151E','자유한국당':'#C9151E',
  '민주당':'#004EA2','더불어민주당':'#004EA2',
  '열린민주당':'#0075C2',
  '정의당':'#FFCD00',
  '국민의당':'#EA5504','바른미래당':'#EA5504',
  '진보당':'#D6001C',
  '녹색당':'#7AB800',
  '무소속':'#888888',
};
const PAL=['#3b7dd8','#1d9e75','#ba7517','#534ab7','#c44569','#2c3e50','#16a085','#8e44ad','#f39c12','#27ae60','#2980b9','#7f8c8d'];
const pcmap={};let pci=0;
function pc(p){
  if(!pcmap[p]){
    const fixed=Object.keys(PARTY_FIXED).find(k=>p.replace(/\s/g,'').includes(k.replace(/\s/g,'')));
    pcmap[p]=fixed?PARTY_FIXED[fixed]:PAL[pci++%PAL.length];
  }
  return pcmap[p];
}

function num(v){const n=parseFloat(String(v).replace(/,/g,''));return isNaN(n)?0:n;}
function fmt(n){return Number(n).toLocaleString();}
function pct(r){return(Math.round(r*1000)/10).toFixed(1)+'%';}

// CSV 데이터가 내장되어 있으므로 업로드 이벤트 불필요

// 페이지 로드 시 내장 CSV 자동 파싱
document.addEventListener('DOMContentLoaded',function(){
  parseCSV(EMBEDDED_CSV);
  finish('선거집계1.csv');
});
function finish(name){
  document.getElementById('hsub').textContent='📄 '+name+' ('+raw.length+'건)';
  // 업로드존은 이미 HTML에서 display:none 처리됨 (uz 변수 불필요)
  document.getElementById('dash').style.display='block';
  init();
}

function parseCSV(txt){
  if(txt.charCodeAt(0)===0xFEFF)txt=txt.slice(1);
  const lines=txt.trim().split(/\r?\n/);
  hdrs=lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,''));
  raw=[];
  for(let i=1;i<lines.length;i++){
    const cols=splitLine(lines[i]);
    if(cols.length<2)continue;
    const r={};
    hdrs.forEach((h,j)=>{r[h]=(cols[j]||'').trim().replace(/^"|"$/g,'');});
    raw.push(r);
  }
  mapCols();
}
function splitLine(l){
  const res=[];let cur='';let q=false;
  for(const c of l){if(c==='"')q=!q;else if(c===','&&!q){res.push(cur);cur='';}else cur+=c;}
  res.push(cur);return res;
}
function mapCols(){
  const f=(list)=>hdrs.find(h=>list.some(c=>h.replace(/\s/g,'').toLowerCase().includes(c)));
  C.year =f(['선거년도','년도','year','연도'])||hdrs[0];
  C.name =f(['선거명','name'])||hdrs[1];
  C.party=f(['정당','party'])||hdrs[2];
  C.kho  =f(['기호','번호'])||hdrs[3];
  C.dong =f(['면동','동','행정'])||hdrs[4];
  C.vote =f(['득표수','득표'])||hdrs[5];
  C.total=f(['투표자수','투표수','total'])||hdrs[6];
  C.rate =f(['득표율','rate'])||hdrs[7];
}

function init(){
  allDongs=[...new Set(raw.map(r=>r[C.dong]).filter(Boolean))].sort();
  selDongs=new Set(allDongs);
  buildDongCards();
  buildSel('fy',C.year);buildSel('fn',C.name);buildSel('fp',C.party);buildSel('fk',C.kho);
  ['fy','fn','fp','fk'].forEach(id=>document.getElementById(id).addEventListener('change',upd));
  upd();
}

function buildSel(id,col){
  const s=document.getElementById(id);
  s.innerHTML='<option value="">전체</option>';
  [...new Set(raw.map(r=>r[col]).filter(Boolean))].sort().forEach(v=>{
    const o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o);
  });
}

function buildDongCards(){
  const box=document.getElementById('dcards');box.innerHTML='';
  allDongs.forEach(d=>{
    const el=document.createElement('div');
    el.className='dcard sel';el.textContent=d;el.dataset.d=d;
    el.addEventListener('click',()=>{
      if(selDongs.has(d)){selDongs.delete(d);el.classList.remove('sel');}
      else{selDongs.add(d);el.classList.add('sel');}
      updDcnt();upd();
    });
    box.appendChild(el);
  });
  updDcnt();
}
function updDcnt(){
  const el=document.getElementById('dcnt');
  el.textContent=selDongs.size===allDongs.length?'전체':selDongs.size+'개 선택';
}
function selAllDong(){
  const all=selDongs.size===allDongs.length;
  document.querySelectorAll('.dcard').forEach(c=>{
    if(all){c.classList.remove('sel');selDongs.delete(c.dataset.d);}
    else{c.classList.add('sel');selDongs.add(c.dataset.d);}
  });
  updDcnt();upd();
}
function resetFilters(){
  ['fy','fn','fp','fk'].forEach(id=>document.getElementById(id).value='');
  selDongs=new Set(allDongs);
  document.querySelectorAll('.dcard').forEach(c=>c.classList.add('sel'));
  updDcnt();upd();
}

function getFilt(){
  const fy=document.getElementById('fy').value;
  const fn=document.getElementById('fn').value;
  const fp=document.getElementById('fp').value;
  const fk=document.getElementById('fk').value;
  return raw.filter(r=>{
    if(fy&&r[C.year]!==fy)return false;
    if(fn&&r[C.name]!==fn)return false;
    if(fp&&r[C.party]!==fp)return false;
    if(fk&&r[C.kho]!==fk)return false;
    if(!selDongs.has(r[C.dong]))return false;
    return true;
  });
}

function grpParty(rows){
  const m={};
  rows.forEach(r=>{
    const p=r[C.party]||'기타';
    if(!m[p])m[p]={p,v:0,t:0};
    m[p].v+=num(r[C.vote]);m[p].t+=num(r[C.total]);
  });
  return Object.values(m).map(g=>({...g,rt:g.t>0?g.v/g.t*100:0})).sort((a,b)=>b.v-a.v);
}
function grpDong(rows){
  const m={};
  rows.forEach(r=>{
    const d=r[C.dong]||'기타';
    if(!m[d])m[d]={d,v:0,t:0};
    m[d].v+=num(r[C.vote]);m[d].t+=num(r[C.total]);
  });
  return Object.values(m).map(g=>({...g,rt:g.t>0?g.v/g.t*100:0})).sort((a,b)=>b.v-a.v);
}

function upd(){
  const rows=getFilt();
  renderCharts(rows);
  renderTable();
}

function renderCharts(rows){
  const pd=grpParty(rows);
  const dd=grpDong(rows);
  const pl=pd.map(d=>d.p);
  const pv=pd.map(d=>d.v);
  const pr=pd.map(d=>Math.round(d.rt*10)/10);
  const pcs=pd.map(d=>pc(d.p));

  // 차트1: 정당별 득표수 (가로 바)
  if(c1)c1.destroy();
  c1=new Chart(document.getElementById('ch1'),{
    type:'bar',
    data:{labels:pl,datasets:[{data:pv,backgroundColor:pcs,borderRadius:5,borderSkipped:false}]},
    options:{
      indexAxis:'y',responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>' '+fmt(ctx.parsed.x)+' 표'}}},
      scales:{
        x:{grid:{color:'#eee'},ticks:{font:{size:11}}},
        y:{grid:{display:false},ticks:{font:{size:12}}}
      }
    }
  });

  // 차트2: 정당별 득표율 (도넛)
  if(c2)c2.destroy();
  c2=new Chart(document.getElementById('ch2'),{
    type:'doughnut',
    data:{labels:pl,datasets:[{data:pr,backgroundColor:pcs,hoverOffset:6,borderWidth:2,borderColor:'#fff'}]},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{
        legend:{position:'right',labels:{font:{size:11},boxWidth:12,padding:8}},
        tooltip:{callbacks:{label:ctx=>' '+ctx.label+': '+ctx.parsed.toFixed(1)+'%'}}
      }
    }
  });

  // 차트3: 면동별 정당별 득표수 (그룹형 바)
  const dongList=dd.map(d=>d.d);
  const partyList=[...new Set(rows.map(r=>r[C.party]).filter(Boolean))];
  partyList.sort((a,b)=>{
    const sa=rows.filter(r=>r[C.party]===a).reduce((s,r)=>s+num(r[C.vote]),0);
    const sb=rows.filter(r=>r[C.party]===b).reduce((s,r)=>s+num(r[C.vote]),0);
    return sb-sa;
  });

  const dongVoteMap={};
  rows.forEach(r=>{
    const d=r[C.dong]||'기타';
    const p=r[C.party]||'기타';
    if(!dongVoteMap[p])dongVoteMap[p]={};
    if(!dongVoteMap[p][d])dongVoteMap[p][d]=0;
    dongVoteMap[p][d]+=num(r[C.vote]);
  });

  const datasets3=partyList.map(p=>({
    label:p,
    data:dongList.map(d=>(dongVoteMap[p]&&dongVoteMap[p][d])||0),
    backgroundColor:pc(p)+'cc',
    borderColor:pc(p),
    borderWidth:1,
    borderRadius:3,
  }));

  if(c3)c3.destroy();
  c3=new Chart(document.getElementById('ch3'),{
    type:'bar',
    data:{labels:dongList,datasets:datasets3},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{
        legend:{
          position:'top',
          labels:{
            font:{size:11},boxWidth:12,padding:10,
            generateLabels:chart=>chart.data.datasets.map((ds,i)=>({
              text:ds.label,
              fillStyle:pc(ds.label),
              strokeStyle:pc(ds.label),
              lineWidth:1,
              hidden:!chart.isDatasetVisible(i),
              datasetIndex:i
            }))
          }
        },
        tooltip:{callbacks:{label:ctx=>' '+ctx.dataset.label+': '+fmt(ctx.parsed.y)+' 표'}}
      },
      scales:{
        x:{grid:{display:false},ticks:{font:{size:11},maxRotation:40}},
        y:{grid:{color:'#eee'},ticks:{font:{size:11}}}
      }
    }
  });
}

// ── 테이블 ──
function getTblData(){
  const fy=document.getElementById('fy').value;
  const fn=document.getElementById('fn').value;
  const fp=document.getElementById('fp').value;
  const fk=document.getElementById('fk').value;
  const q=document.getElementById('sb').value.toLowerCase();

  const base=raw.filter(r=>{
    if(fy&&r[C.year]!==fy)return false;
    if(fn&&r[C.name]!==fn)return false;
    if(fp&&r[C.party]!==fp)return false;
    if(fk&&r[C.kho]!==fk)return false;
    return true;
  });
  const sel=base.filter(r=>selDongs.has(r[C.dong]));

  const gm={};
  sel.forEach(r=>{
    const k=[r[C.year],r[C.name],r[C.party],r[C.kho]].join('|||');
    if(!gm[k])gm[k]={yr:r[C.year],nm:r[C.name],pt:r[C.party],kh:r[C.kho],dongs:new Set(),v:0,t:0};
    gm[k].dongs.add(r[C.dong]);
    gm[k].v+=num(r[C.vote]);
    gm[k].t+=num(r[C.total]);
  });

  let res=Object.values(gm).map(g=>({
    yr:g.yr,nm:g.nm,pt:g.pt,kh:g.kh,
    dong:[...g.dongs].sort().join(', '),
    v:g.v,t:g.t,
    rt:g.t>0?g.v/g.t*100:0
  }));

  if(q)res=res.filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(q)));
  return res;
}

let tblData=[];
const TCOLS=[
  {k:'yr', l:'선거년도',tp:'s'},
  {k:'nm', l:'선거명',  tp:'s'},
  {k:'pt', l:'정당',    tp:'party'},
  {k:'kh', l:'기호',    tp:'s'},
  {k:'dong',l:'면동',   tp:'s'},
  {k:'v',  l:'득표수',  tp:'n'},
  {k:'t',  l:'투표자수',tp:'n'},
  {k:'rt', l:'득표율',  tp:'r'}
];

function renderTable(){
  tblData=getTblData();
  if(sortC>=0){
    const c=TCOLS[sortC];
    tblData.sort((a,b)=>{
      let av=a[c.k],bv=b[c.k];
      if(c.tp==='n'||c.tp==='r'){av=parseFloat(av)||0;bv=parseFloat(bv)||0;}
      else{av=String(av||'');bv=String(bv||'');}
      return(av>bv?1:av<bv?-1:0)*sortD;
    });
  }
  const th=document.getElementById('th');
  th.innerHTML='<tr>'+TCOLS.map((c,i)=>{
    const arr=sortC===i?(sortD===1?' ▲':' ▼'):'';
    return`<th onclick="sortTbl(${i})">${c.l}<span style="font-size:10px">${arr}</span></th>`;
  }).join('')+'</tr>';

  const tb=document.getElementById('tb');
  const rows=tblData.slice(0,300);
  if(rows.length===0){
    tb.innerHTML=`<tr><td colspan="${TCOLS.length}" class="nodata">조건에 맞는 데이터가 없습니다</td></tr>`;
  }else{
    tb.innerHTML=rows.map(r=>'<tr>'+TCOLS.map(c=>{
      let v=r[c.k];
      if(c.tp==='n'){
        v=`<span style="font-variant-numeric:tabular-nums">${fmt(v)}</span>`;
      }else if(c.tp==='r'){
        v=`<span style="font-variant-numeric:tabular-nums">${(Math.round(parseFloat(v)*10)/10).toFixed(1)}%</span>`;
      }else if(c.tp==='party'){
        const col=pc(v);
        v=`<span class="pflag" style="background:${col}22;color:${col};border:1px solid ${col}55">${v}</span>`;
      }
      return`<td>${v??''}</td>`;
    }).join('')+'</tr>').join('');
  }
  document.getElementById('tf').textContent=
    `총 ${tblData.length.toLocaleString()}건${tblData.length>300?' (300건까지 표시)':''}`;
}

function sortTbl(i){
  if(sortC===i)sortD*=-1;else{sortC=i;sortD=1;}
  renderTable();
}
